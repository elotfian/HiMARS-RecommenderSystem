<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>HiMARS three-stage framework</title>
<desc>Flowchart showing the three stages of HiMARS: candidate generation, bi-objective Pareto optimization, and personalized list selection</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Stage 1 header -->
<rect x="140" y="30" width="400" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489" x="340" y="53" text-anchor="middle" dominant-baseline="central">Stage 1 — Candidate generation</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="72" text-anchor="middle" dominant-baseline="central">Item-based CF with adjusted cosine similarity</text>

<!-- Stage 1 detail box -->
<rect x="180" y="100" width="320" height="80" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="122" text-anchor="middle" dominant-baseline="central">Input: user–item rating matrix</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="142" text-anchor="middle" dominant-baseline="central">Predict unrated items via weighted-sum (N = 20 neighbors)</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="162" text-anchor="middle" dominant-baseline="central">Output: ranked top-k list  (k = 100)</text>

<!-- Arrow 1→2 -->
<line x1="340" y1="181" x2="340" y2="217" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Stage 2 header -->
<rect x="140" y="220" width="400" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="340" y="243" text-anchor="middle" dominant-baseline="central">Stage 2 — Bi-objective Pareto optimization</text>
<text font-family="sans-serif" font-size="12" fill="#0F6E56" x="340" y="262" text-anchor="middle" dominant-baseline="central">Simultaneously maximize accuracy and diversity</text>

<!-- Stage 2 detail box -->
<rect x="180" y="290" width="320" height="100" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="314" text-anchor="middle" dominant-baseline="central">Input: top-k candidate list</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="334" text-anchor="middle" dominant-baseline="central">Search space: all sublists of size s = 10 from top-k</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="354" text-anchor="middle" dominant-baseline="central">Algorithms: HANv1, HANv2, HANIv1, HANIv2</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="374" text-anchor="middle" dominant-baseline="central">Output: Pareto set  P = {P₁, …, Pₘ}</text>

<!-- Arrow 2→3 -->
<line x1="340" y1="391" x2="340" y2="427" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Stage 3 header -->
<rect x="140" y="430" width="400" height="52" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="340" y="453" text-anchor="middle" dominant-baseline="central">Stage 3 — Personalized list selection</text>
<text font-family="sans-serif" font-size="12" fill="#993C1D" x="340" y="472" text-anchor="middle" dominant-baseline="central">Closest Pareto solution to the ideal point</text>

<!-- Stage 3 detail box -->
<rect x="180" y="500" width="320" height="80" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="522" text-anchor="middle" dominant-baseline="central">Input: Pareto set</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="542" text-anchor="middle" dominant-baseline="central">Scale objectives → compute distance to ideal (1, 1)</text>
<text font-family="sans-serif" font-size="12" fill="#5F5E5A" x="340" y="562" text-anchor="middle" dominant-baseline="central">Output: optimal top-s recommendation list</text>

<!-- Stage numbers on left -->
<text font-family="sans-serif" font-size="12" fill="#888" x="128" y="58" text-anchor="end">1</text>
<text font-family="sans-serif" font-size="12" fill="#888" x="128" y="248" text-anchor="end">2</text>
<text font-family="sans-serif" font-size="12" fill="#888" x="128" y="458" text-anchor="end">3</text>

<!-- f1 / f2 labels -->
<text font-family="sans-serif" font-size="11" fill="#5F5E5A" x="514" y="328" text-anchor="start">f₁: accuracy</text>
<text font-family="sans-serif" font-size="11" fill="#5F5E5A" x="514" y="352" text-anchor="start">f₂: diversity</text>

</svg>
